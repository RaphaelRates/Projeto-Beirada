services:
  # ─────────────────────────────────────────────────────────
  # Serviço principal da API YOLO
  # ─────────────────────────────────────────────────────────
  yolo-api:
    build:
      context: .
      dockerfile: beirada_ia/Dockerfile.api
    container_name: yolo-api
    ports:
      - "8000:8000"
    privileged: true
    devices: 
     - /dev/ttyACM0:/dev/ttyACM0  
    volumes:
      - ./beirada_ia/models:/app/models:ro
      - ./beirada_ia/app/output:/app/output
      - /dev:/dev
      - /run/udev:/run/udev:ro
    environment:
      - MODEL_NAME=yolov8n.pt
      - MODEL_PATH=/app/models/yolov8n.pt
      - CONFIDENCE=0.65
      - ESP32_SERIAL_PORT=/dev/ttyACM0
      - ESP32_SERIAL_BAUD=115200
      - ESP32_MIN_INTERVAL_S=0.1
      - ESP32_SERIAL_ENABLED=true
    networks:
      - yolo-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 40s

  # ─────────────────────────────────────────────────────────
  # Serviço de streaming com câmera (Raspberry Pi 5)
  # ─────────────────────────────────────────────────────────
  yolo-stream:
    build:
      context: .
      dockerfile: beirada_ia/Dockerfile.api
    container_name: yolo-stream
    ports:
      - "5000:5000"
    privileged: true
    volumes:
      - ./beirada_ia/models:/app/models:ro
      - /dev:/dev
      - /run/udev:/run/udev:ro
    environment:
      - MODEL_NAME=yolov8n.pt
      - MODEL_PATH=/app/models/yolov8n.pt
      - CONFIDENCE=0.65
    command: >
      python3 stream/mjpeg_server.py
      --device 0
      --infer-every 2
      --infer-size 224
      --port 5000
    networks:
      - yolo-net
    restart: unless-stopped
    depends_on:
      yolo-api:
        condition: service_healthy

  # ─────────────────────────────────────────────────────────
  # Cliente para processamento de imagens
  # ─────────────────────────────────────────────────────────
  yolo-client:
    build:
      context: .
      dockerfile: beirada_ia/Dockerfile.client
    container_name: yolo-client
    volumes:
      - ./beirada_ia/client/images:/client/images:ro
      - ./beirada_ia/client/output:/client/output
    environment:
      - API_URL=http://yolo-api:8000
    networks:
      - yolo-net
    depends_on:
      yolo-api:
        condition: service_healthy
    restart: unless-stopped

networks:
  yolo-net:
    driver: bridge