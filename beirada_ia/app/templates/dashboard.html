<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard · SMA</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="/static/css/dashboard.css" />
</head>
<body>
    <div class="dashboard">
        <!-- HEADER -->
        <header class="header">
            <h1>📊 Dashboard · SMA</h1>
            <div class="controls">
                <label for="periodSelect">Período:</label>
                <select id="periodSelect">
                    <option value="day">Dia</option>
                    <option value="week" selected>Semana</option>
                    <option value="month">Mês</option>
                    <option value="semester">Semestre</option>
                    <option value="trimestre">Trimestre</option>
                    <option value="year">Ano</option>
                </select>
                <button id="refreshBtn">Atualizar</button>
            </div>
        </header>

        <!-- CARDS -->
        <section class="cards">
            <div class="card"><h3>Total Predições</h3><p id="totalPredictions">0</p></div>
            <div class="card"><h3>Acurácia Média</h3><p id="avgAccuracy">0%</p></div>
            <div class="card"><h3>Classes Únicas</h3><p id="uniqueClasses">0</p></div>
            <div class="card"><h3>Última Atualização</h3><p id="lastUpdate">--</p></div>
        </section>

        <!-- GRIDS DE GRÁFICOS -->
        <section class="charts-grid">

            <!-- 1. Métricas por período (barras) -->
            <div class="chart-card">
                <h2>📈 Métricas por Período</h2>
                <div class="chart-wrapper"><canvas id="metricsChart"></canvas></div>
            </div>

            <!-- 2. Evolução das classes (linhas) -->
            <div class="chart-card">
                <h2>📉 Evolução das Classes</h2>
                <div class="chart-wrapper"><canvas id="classesChart"></canvas></div>
            </div>

            <!-- 3. Distribuição (pizza) -->
            <div class="chart-card">
                <h2>🍩 Distribuição das Classes</h2>
                <div class="chart-wrapper" style="max-width:300px;margin:0 auto;"><canvas id="distributionChart"></canvas></div>
            </div>

            <!-- 4. Ranking de Classes (barras horizontais) -->
            <div class="chart-card">
                <h2>🏆 Ranking de Classes</h2>
                <div class="chart-wrapper"><canvas id="rankingChart"></canvas></div>
            </div>

            <!-- 5. Tendência Acumulada (área empilhada) -->
            <div class="chart-card">
                <h2>📊 Tendência Acumulada</h2>
                <div class="chart-wrapper"><canvas id="stackedAreaChart"></canvas></div>
            </div>

            <!-- 6. Comparação de Métricas por Classe (radar) -->
            <div class="chart-card">
                <h2>📡 Radar - Métricas por Classe</h2>
                <div class="chart-wrapper"><canvas id="radarChart"></canvas></div>
            </div>

            <!-- 7. Confiança vs Latência (dispersão) -->
            <div class="chart-card">
                <h2>⏱️ Confiança × Latência</h2>
                <div class="chart-wrapper"><canvas id="scatterChart"></canvas></div>
            </div>

            <!-- 8. Previsões por Hora (barras) -->
            <div class="chart-card">
                <h2>🕒 Previsões por Hora</h2>
                <div class="chart-wrapper"><canvas id="hourlyChart"></canvas></div>
            </div>

        </section>
    </div>

    <script src="/static/js/dashboard.js"></script>
</body>
</html>
