<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beirada IA</title>

    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

    <header class="header">
        <div>
            <h1>Beirada IA</h1>
            <p>YOLO Edge Vision</p>
        </div>

        <div class="status-container">
            <span id="status-dot" class="dot online"></span>
            <span id="status-text">Online</span>
        </div>
    </header>

    <main class="stream-container">

        <div class="stream-wrapper">

            <img
                id="camera-stream"
                src="/stream/camera"
                alt="Camera Stream"
            >

            <div id="camera-offline" class="camera-offline">

                <div class="offline-content">
                    <h2>📷 Câmera indisponível</h2>
                    <p>Aguardando conexão com o stream...</p>
                </div>

            </div>

        </div>

    </main>

    <footer class="metrics">

        <div class="metric">
            <span>FPS</span>
            <strong id="fps">--</strong>
        </div>

        <div class="metric">
            <span>Inferência</span>
            <strong id="latency">-- ms</strong>
        </div>

        <div class="metric">
            <span>Requests</span>
            <strong id="requests">--</strong>
        </div>

        <div class="metric">
            <span>Modelo</span>
            <strong id="model">YOLOv8</strong>
        </div>

        <div class="metric">
            <span>Status</span>
            <strong id="status-footer">Online</strong>
        </div>

    </footer>

    <script src="/static/js/main.js"></script>

</body>
</html>
